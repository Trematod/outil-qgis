name: Build Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Installer les dependances
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Executer les tests
        shell: pwsh
        run: python -m pytest -q

      - name: Construire avec PyInstaller
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm PreparationDonnees.spec

      - name: Trouver le bundle PyInstaller
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter PreparationDonnees.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Host "PreparationDonnees.exe introuvable. Contenu de dist :"
            if (Test-Path dist) {
              Get-ChildItem -Path dist -Recurse -Force | Select-Object FullName, Length, Mode | Format-Table -AutoSize
            } else {
              Write-Host "Le dossier dist n'existe pas."
            }
            throw "PyInstaller n'a pas produit PreparationDonnees.exe."
          }
          $bundle = $exe.Directory.FullName
          "BUNDLE_DIR=$bundle" >> $env:GITHUB_ENV
          Write-Host "Bundle PyInstaller trouve : $bundle"

      - name: Assembler le dossier portable
        shell: pwsh
        run: |
          if (Test-Path distribution_windows) {
            Remove-Item distribution_windows -Recurse -Force
          }
          New-Item distribution_windows -ItemType Directory | Out-Null
          Copy-Item "$env:BUNDLE_DIR\*" distribution_windows -Recurse -Force
          Copy-Item configuration.json distribution_windows/configuration.json -Force
          Copy-Item portable_start.bat distribution_windows/start.bat -Force
          Copy-Item portable_stop.bat distribution_windows/stop.bat -Force
          Copy-Item README_PORTABLE_WINDOWS.txt distribution_windows/README_UTILISATEUR.txt -Force

      - name: Verifier le contenu du package
        shell: pwsh
        run: |
          $required = @(
            "distribution_windows/PreparationDonnees.exe",
            "distribution_windows/configuration.json",
            "distribution_windows/start.bat",
            "distribution_windows/stop.bat"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              throw "Fichier requis absent : $path"
            }
          }
          $resourceFiles = @("upload.html", "result.html", "styles.css", "app.js")
          foreach ($name in $resourceFiles) {
            $resource = Get-ChildItem -Path distribution_windows -Filter $name -File -Recurse | Select-Object -First 1
            if ($null -eq $resource) {
              throw "Ressource requise absente du bundle : $name"
            }
            Write-Host "$name trouve : $($resource.FullName)"
          }

      - name: Creer le ZIP
        shell: pwsh
        run: Compress-Archive -Path distribution_windows -DestinationPath distribution_windows.zip -Force

      - name: Publier le ZIP
        uses: actions/upload-artifact@v4
        with:
          name: distribution_windows
          path: distribution_windows.zip
          if-no-files-found: error
          retention-days: 30
